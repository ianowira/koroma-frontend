version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)", prefix-development: "chore(deps-dev)" }
    labels: [dependencies]
    groups:
      nextjs-react: { patterns: ["next", "eslint-config-next", "@next/*", "react", "react-dom", "@types/react*"] }
      tailwind: { patterns: ["tailwindcss", "@tailwindcss/*", "postcss"] }
      lint: { patterns: ["eslint*", "@eslint/*", "typescript-eslint"] }
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    commit-message: { prefix: "chore(docker)" }
    labels: [dependencies, docker]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Berlin }
    commit-message: { prefix: "chore(ci)" }
    labels: [dependencies, ci]
    groups:
      github-actions: { patterns: ["*"] }
